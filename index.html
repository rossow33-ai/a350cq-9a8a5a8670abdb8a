<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0f2444;color:#eef3fb;display:flex;flex-direction:column}
.hide{display:none!important}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px;max-width:640px;width:100%;margin:0 auto}
header h1{margin:0;font-size:1rem;font-weight:600;letter-spacing:.02em;opacity:.9}

.icon{background:none;border:0;color:#fff;font-size:1.5rem;width:44px;height:44px;border-radius:12px;cursor:pointer}.icon:active{background:#ffffff1a}
.bar{height:3px;background:#ffffff14;max-width:640px;width:calc(100% - 36px);margin:0 auto;border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;background:#3ccf7a;width:0;transition:width .3s}

#back{margin-bottom:12px}
.list{display:block;text-align:left;font-size:.95rem;line-height:1.35;padding:10px 0}
.ttl{font-weight:700;color:#14233c;font-size:1.05rem;margin-bottom:8px}
.cond{font-weight:700;color:#c8102e;margin:12px 0 4px;font-size:.88rem}

.it b{font-weight:600}.it .dl{flex:1;border-bottom:2px dotted #b8c2d2;min-width:12px}.it .ac{font-weight:800;color:#0d5a2f;text-align:right;max-width:55%}

.front .txt{font-weight:600}
#testBadge{background:#c8102e;color:#fff;font-size:.7rem;font-weight:800;letter-spacing:.08em;padding:4px 8px;border-radius:6px}
.tq{font-weight:700;font-size:1.05rem;color:#14233c;margin-bottom:6px;white-space:pre-line}
.tp{font-size:.72rem;color:#9aa6b8;font-weight:700;margin-bottom:6px}
.hid{display:inline-block;min-width:70px;height:1.2em;background:#e3e8f0;border-radius:6px;vertical-align:middle}
.cur{background:#fff6d6;border-radius:8px;padding-left:6px;padding-right:6px;margin:0 -6px}
.face .list{padding-bottom:28px}.rbtn{display:block;margin:18px auto 0;background:#c8102e;color:#fff;border:0;border-radius:12px;padding:14px 28px;font-size:1rem;font-weight:700;cursor:pointer}
.tdiv{margin:22px 0 8px;padding-top:12px;border-top:2px solid #e3e8f0;font-size:.72rem;font-weight:700;color:#9aa6b8;letter-spacing:.05em}#q>.tdiv:first-child,#q>#curCard:first-child>.tdiv{border-top:0;margin-top:0;padding-top:0}
.ln{animation:fi .35s ease}@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.insight{font-size:.75rem;opacity:.6;text-align:center;margin:-4px 0 10px;min-height:1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal{text-align:center}.goal .big{font-size:3rem}.goal h3{margin:8px 0 4px;font-size:1.3rem;color:#14233c}.goal p{color:#3a4b66;font-size:.9rem}
.pf{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;height:64px}.pf.off{visibility:hidden}.pf button{border:0;border-radius:14px;color:#fff;font-size:1.25rem;font-weight:800;cursor:pointer}.pass{background:#2e9e5b}.fail{background:#d7263d}
.ok{color:#2e9e5b}.bad,.it .ac.bad{color:#d7263d}
#homeView{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding-bottom:10vh}
.hometitle{text-align:center;font-size:2.4rem;font-weight:800;letter-spacing:.02em}.homesub{text-align:center;font-size:.85rem;opacity:.6;margin-top:-10px;min-height:1em}
.hbtn{border:0;border-radius:20px;padding:28px 0;font-size:1.4rem;font-weight:700;color:#fff;cursor:pointer;box-shadow:0 8px 24px #0004}.hbtn:active{transform:scale(.98)}
.hf{background:#1b6fd1}.hr{background:#d98a1c;padding:20px 0;font-size:1.15rem}.ht{background:#c8102e}#homeResume{margin-top:-8px}
.grade{font-size:4rem;font-weight:900;line-height:1;margin:6px 0 2px}.grade span{font-size:1.2rem;font-weight:700;opacity:.6}
.party{width:100%;max-width:300px;max-height:30vh;object-fit:contain;border-radius:18px;display:block;margin:4px auto 10px;box-shadow:0 6px 18px #0002}
.gstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:8px;margin:14px 0 4px}.gstats div{background:#f1f4f9;border-radius:12px;padding:10px 4px}.gstats b{display:block;font-size:1.3rem;color:#14233c}.gstats span{font-size:.68rem;color:#6b7a90}
.goal .rbtn{width:100%;max-width:280px;margin-top:12px}
.thint{text-align:center;font-size:.75rem;color:#9aa6b8;margin-top:10px}
#tview{display:block;text-align:left;font-size:.95rem;line-height:1.35;overflow:auto}
</style></head><body>
<header><h1 id="hdrTitle">✈️ A350 Recurrent</h1><div id="who"><button class="icon" id="homeBtn" aria-label="Home">⌂</button><span id="testBadge" class="hide">TEST</span><button class="icon" id="menuBtn" aria-label="Menu">☰</button></div></header>
<div class="bar" id="barwrap"><i id="barfill"></i></div>
<main><section id="homeView"><div class="hometitle">Recurrent</div><div class="homesub">A350 · Limitations &amp; Memory Items</div><button class="hbtn hf" id="homeFlash">Flashcards</button><button class="hbtn ht" id="homeTest">Test Mode</button><button class="hbtn hr hide" id="homeRev"></button><div class="homesub" id="homeResume"></div></section>

<div class="face back"><span class="tag" id="tagB"></span><div class="txt list" id="a"></div><div class="foot"><span></span><button class="srcbtn" id="srcBtn" title="View source slide">🖼️</button></div></div></div></div>

</section>

</main>
<div id="menu" class="hide"><div class="panel">
<button class="mi" id="skip">⏭  Skip card</button><button class="mi" id="flipBtn">↺  Flip card</button><button class="mi" id="homeMi">⌂  Home</button><button class="mi hide" id="testBtn"></button><button class="mi hide" id="revMi"></button><button class="mi" id="restartMi">🔄  Restart test</button><button class="mi" id="statsBtn">📊  Stats</button>

<div class="mh" id="pos"></div><div class="mh" id="prog" style="margin-top:0"></div>
<button class="mi" id="reset" style="margin-top:auto;opacity:.7">⟲  Reset all progress</button></div></div>
<div id="srcModal" class="hide"><img id="srcimg" alt="Source slide"></div>
<script>
const APPV="v20261010p";
function chkUpd(){(async()=>{try{const t=await (await fetch(location.pathname+"?_="+Date.now(),{cache:"no-store"})).text();const m=t.match(/APPV="([^"]+)"/);if(m&&m[1]!==APPV&&!sessionStorage.getItem("upd"+m[1])){sessionStorage.setItem("upd"+m[1],1);location.replace(location.pathname+"?v="+m[1])}}catch(e){}})()}
if(location.protocol.startsWith("http")){chkUpd();document.addEventListener("visibilitychange",()=>{if(!document.hidden)chkUpd()})}
const T={6:"Limitations",8:"Memory Items",9:"Memory Items",10:"Evacuation"};
// back rows: ["c",cond] condition, [item,action] checklist line, ["n",text] note, ["f",text] flow line, ["v",text] single value
const C=[
{id:"L-alt",s:6,q:"Maximum Operating Altitude",b:[["v","43,100′"]]},
{id:"L-tw",s:6,q:"Maximum takeoff and landing tailwind component",b:[["v","15 knots, or as restricted by Delta Company Pages"]]},
{id:"L-xwto",s:6,q:"Crosswind limit for takeoff, including gusts",b:[["v","35 knots"]]},
{id:"L-xwld",s:6,q:"Crosswind limit for landing, including gusts",b:[["v","40 knots"]]},
{id:"L-apto",s:6,q:"On takeoff, the autopilot must not be engaged until at least ____ after lift-off.",b:[["v","5 seconds"]]},
{id:"L-apga",s:6,q:"After a manual go around, the autopilot must not be engaged below a minimum altitude of ____.",b:[["v","100′ AGL"]]},
{id:"L-autoland",s:6,q:"Wind limits for autoland operations\n(headwind, tailwind, and crosswinds)",b:[["Headwind","40 knots"],["Tailwind","15 knots, or as restricted by Delta Company Pages"],["Crosswinds","30 knots, including gusts"],["n","(15 knots when operating below Cat I minimums)"]]},
{id:"L-flap",s:6,q:"Flight Controls\nMaximum Flap Extension Altitude",b:[["v","20,000′"]]},
{id:"M-brk",s:8,q:"1.2.1 Loss of Braking\nmemory items",b:[["c","If no braking:"],["REV","MAX"],["BRAKE PEDALS","RELEASE"],["A-SKID OFF","ORDER"],["A-SKID","OFF"],["BRAKE PEDALS","PRESS"],["c","If still no braking:"],["PARK BRK","USE"]]},
{id:"M-ed",s:8,q:"1.2.2 Emer Descent\nmemory items",b:[["c","If the cabin pressure altitude is above 10,000 ft:"],["CREW OXY MASKS","USE"],["SIGNS","ON"],["EMER DESCENT","INITIATE"],["n","Initiate the emergency descent with one of the following techniques:\n- Use of the AUTO EMER DESCENT function\n- Use of selected guidance via the AFS CP."],["c","If A/THR is not active:"],["ALL THR LEVERS","IDLE"],["SPEED BRAKES LEVER","FULL"]]},
{id:"M-uas",s:9,q:"1.2.3 Unreliable Air Speed Indication\nmemory items",b:[["c","If the safe conduct of the flight is impacted:"],["A/P","OFF"],["A/THR","OFF"],["FD","OFF"],["c","PITCH/THRUST:"],["Below THR RED ALT","12.5°/TOGA"],["Above THR RED ALT and Below FL 100","10°/CLB"],["Above THR RED ALT and Above FL 100","5°/CLB"],["FLAPS (if CONF 0(1)(2)(3))","MAINTAIN CURRENT CONF"],["FLAPS (if CONF FULL)","SELECT CONF 3 AND MAINTAIN"],["SPEED BRAKES","CHECK RETRACTED"],["L/G","UP"]]},
{id:"M-stall",s:9,q:"1.2.4 Stall Warning at Liftoff\nmemory items",b:[["c","If stall warnings trigger at liftoff, apply the following immediate actions:"],["THRUST","TOGA"],["c","At the same time:"],["PITCH ATTITUDE","12.5°"],["BANK","WINGS LEVEL"]]},
{id:"E-flow",s:10,q:"1.3 Emergency Evacuation\nflow / philosophy",b:[["n","The checklist follows the flow pattern of:"],["f","STOP"],["f","CONFIGURE"],["f","SHUTDOWN"],["f","EVACUATE"],["n","Evacuation flow items are not included within the Evacuation checklist. They are meant to refresh the logical pattern of procedures that must occur for a successful evacuation. In the unlikely event that the checklist cannot be read due to smoke/fire, darkness, injury or incapacitation, this simple flow or philosophy should be memorized and lead the pilot to completion of all critical tasks contributing to the safest possible evacuation."]]}
];
const $=id=>document.getElementById(id);
const esc=x=>String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const COL=["#888","#d7263d","#f46036","#e2b100","#7cb518","#1b998b"];
const KEY="recurrentFC_v2";
let tst={pos:0,run:{}};const ORDER=[...C].sort((a,b)=>a.s-b.s);function tsave(){try{localStorage.setItem("recurrentFC_test",JSON.stringify(tst))}catch(e){}}
try{const x=JSON.parse(localStorage.getItem("recurrentFC_test"));if(x&&typeof x.pos=="number")tst=x}catch(e){}
let reviewMode=false,revSet=[];
let testMode=false,steps=[],tIdx=0,tRev=false;
let data,filt="all",cur=null,last=null,flipped=false;
function load(){let d;try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){}return d&&d.hist?d:{hist:{}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function todayRating(id){const h=data.hist[id]||[],t=today();for(let k=h.length-1;k>=0;k--)if(h[k].d==t)return h[k].r;return null}
function avg(id){const h=data.hist[id]||[];return h.length?h.reduce((s,x)=>s+x.r,0)/h.length:null}
function info(c){const h=data.hist[c.id]||[];const tr=todayRating(c.id);let ra=null;if(h.length){let sw=0,sv=0,w=1;for(let k=h.length-1;k>=0&&k>=h.length-8;k--){sv+=h[k].r*w;sw+=w;w*=0.6}ra=sv/sw}
const lapse=h.length>1?Math.max(0,h[h.length-2].r-h[h.length-1].r):0;const lastD=h.length?h[h.length-1].d:null;const days=lastD?Math.max(0,Math.round((new Date(today())-new Date(lastD))/864e5)):null;
const seen=(data.seen||{})[c.id]||0;const mins=(Date.now()-seen)/6e4;return{h,tr,ra,lapse,days,mins}}
function priority(c){const f=info(c);if(!f.h.length)return 100;const lvl=f.tr??f.ra;let p=Math.pow(6-lvl,2)+1;p+=8*f.lapse;if(f.tr==null)p+=Math.min(f.days||0,14)*0.7+3;if(f.tr==5)p=0.1;if(f.mins<2)p*=0.3;return p}
function weight(c){return priority(c)}
function shortName(c){return c.q.split("\n")[0].replace(/^[\d.]+\s*/,"").replace(/\s*memory items/i,"")}
function insight(){if(testMode){$("insight").textContent="";return}if(reviewMode){$("insight").textContent="Review · "+revSet.length+" left";return}const ranked=C.map(c=>({c,f:info(c),p:priority(c)})).sort((a,b)=>b.p-a.p);const t=ranked[0];const at5=C.filter(c=>todayRating(c.id)==5).length;
let why=!t.f.h.length?"not rated yet":t.f.lapse?"slipped last time":t.f.tr!=null?"rated "+t.f.tr+" today":"avg "+t.f.ra.toFixed(1)+(t.f.days?", "+t.f.days+"d ago":"");
if(t.f.h.length&&t.f.ra!=null&&!/avg/.test(why))why="avg "+t.f.ra.toFixed(1)+" · "+why;
const nw=C.filter(c=>!(data.hist[c.id]||[]).length).length;$("insight").textContent=at5==C.length?"":!t.f.h.length?at5+"/"+C.length+" at 5 today · "+nw+" new":"Focus: "+shortName(t.c)+" — "+why+" · "+at5+"/"+C.length+" at 5"}
function goalScreen(){cur=null;flipped=false;$("card").classList.remove("flip");$("rate").classList.add("off");$("ratelbl").style.visibility="hidden";$("srcBtn").style.display="none";$("tagF").textContent="";$("insight").textContent="";
$("q").classList.remove("txt");$("q").classList.add("list");const P=["koala1","koala2","koala3","lion1","lion2","kangaroo1","kangaroo2"];let hsh=0;for(const ch of today())hsh=(hsh*31+ch.charCodeAt(0))>>>0;const gif=P[hsh%P.length];
const nToday=C.reduce((n,c)=>n+(data.hist[c.id]||[]).filter(x=>x.d==today()).length,0);const all=C.flatMap(c=>data.hist[c.id]||[]);const allAvg=all.length?(all.reduce((a,x)=>a+x.r,0)/all.length).toFixed(1):"–";const lg=(data.grades||[]).slice(-1)[0];
$("q").innerHTML='<div class="goal"><img class="party" src="img/party/'+gif+'.gif?v=1" alt="'+gif.replace(/\d/,"")+' partying"><h3>All cards at 5 today</h3><p>Every card rated 5 — nice work!</p>'+
'<div class="gstats"><div><b>'+C.length+'/'+C.length+'</b><span>at 5 today</span></div><div><b>'+nToday+'</b><span>ratings today</span></div><div><b>'+allAvg+'</b><span>all-time avg</span></div>'+(lg?'<div><b style="color:'+gcol(lg.g)+'">'+lg.g+'</b><span>last test</span></div>':'')+'</div>'+
'<button class="rbtn" id="keep">Keep reviewing</button><button class="rbtn" id="goalHome" style="background:#14233c">⌂ Home</button></div>';
$("keep").onclick=e=>{e.stopPropagation();data.keep=today();save();show()};$("goalHome").onclick=e=>{e.stopPropagation();view("homeView")}}
function pool(){return C.filter(c=>(filt=="all"||String(c.s)==filt)&&(!reviewMode||revSet.includes(c.id)))}
function pick(){const p=pool();const cand=p.length>1?p.filter(c=>c!==last):p;const tot=cand.reduce((s,c)=>s+weight(c),0);let x=Math.random()*tot;for(const c of cand){x-=weight(c);if(x<0)return c}return cand[cand.length-1]}
function backHTML(c){return '<div class="ttl">'+esc(c.q.replace(/\n/g," — "))+'</div>'+c.b.map(r=>{
if(r[0]=="c")return '<div class="cond">'+esc(r[1])+'</div>';if(r[0]=="n")return '<div class="nt">'+esc(r[1]).replace(/\n/g,"<br>")+'</div>';
if(r[0]=="f")return '<div class="flow">'+esc(r[1])+'</div>';if(r[0]=="v")return '<div class="flow">'+esc(r[1])+'</div>';
return '<div class="it"><b>'+esc(r[0])+'</b><span class="dl"></span><span class="ac">'+esc(r[1])+'</span></div>'}).join("")}
function mkSteps(c){const st=[];let pend=[];c.b.forEach(r=>{if(r[0]=="c"){pend.push(r[1]);return}st.push({conds:pend,r});pend=[]});return st}
function rowHTML(r,reveal){const H='<span class="hid"></span>';
if(r[0]=="n")return '<div class="nt">'+(reveal?esc(r[1]).replace(/\n/g,"<br>"):H)+'</div>';
if(r[0]=="f"||r[0]=="v")return '<div class="flow">'+(reveal?esc(r[1]):H)+'</div>';
return '<div class="it"><b>'+esc(r[0])+'</b><span class="dl"></span><span class="ac">'+(reveal?esc(r[1]):H)+'</span></div>'}
function cardLog(c,idx,n,steps,r){let h='<div class="tdiv">Card '+(idx+1)+'/'+ORDER.length+(r?(r=="P"?' · <span class="ok">✓ Pass</span>':' · <span class="bad">✗ Fail</span>'):'')+'</div><div class="tq">'+esc(c.q)+'</div>';
steps.forEach((s,i)=>{if(i>=n)return;s.conds.forEach(x=>h+='<div class="cond">'+esc(x)+'</div>');h+='<div class="ln">'+rowHTML(s.r,true)+'</div>'});return h}
function renderTest(){let h="";for(let k=0;k<tst.pos;k++){const c=ORDER[k];if(tst.run[c.id]==null)continue;const st=mkSteps(c);h+=cardLog(c,k,st.length,st,tst.run[c.id])}
const done=tIdx==steps.length-1;h+='<div id="curCard">'+cardLog(cur,tst.pos,tIdx+1,steps,null)+'<div class="tp">'+(tIdx<0?'':'Line '+(tIdx+1)+'/'+steps.length)+'</div></div>';
h+='<div class="thint">'+(done?'Pass or fail below ↓':tIdx<0?'Tap to reveal line 1 of '+steps.length:'Tap for next line')+'</div>';
$("q").innerHTML=h;$("pf").classList.toggle("off",!done);flipped=done;
const f=$("q").parentElement,nl=$("q").querySelectorAll(".ln"),last=nl[nl.length-1];
const go=()=>{if(f.scrollTo)f.scrollTo({top:f.scrollHeight,behavior:tIdx<0&&!tst.pos?"auto":"smooth"});else f.scrollTop=f.scrollHeight};go()}
function testTap(){if(tst.pos>=ORDER.length)return;if(tIdx<steps.length-1){tIdx++;renderTest()}}
function gcol(g){return g>=90?"#2e9e5b":g>=70?"#d98a1c":"#d7263d"}
function recentGrades(){const g=(data.grades||[]).slice(-5).reverse();if(!g.length)return "";return '<div class="cond" style="color:#14233c">Recent test grades</div>'+g.map(x=>'<div class="it"><b>'+x.d+'</b><span class="dl"></span><span class="ac" style="color:'+gcol(x.g)+'">'+x.g+' / 100</span></div>').join("")}
function testDone(){cur=null;flipped=false;modeRows();$("card").classList.remove("flip");$("srcBtn").style.display="none";$("insight").textContent="";
$("tagF").textContent="Test complete";$("q").classList.remove("txt");$("q").classList.add("list");
const np=ORDER.filter(c=>tst.run[c.id]=="P").length,fails=ORDER.filter(c=>tst.run[c.id]!="P");const grade=Math.round(np/ORDER.length*100);
if(!tst.graded){tst.graded=true;tsave();data.lastFailed=fails.map(c=>c.id);(data.grades=data.grades||[]).push({d:today(),g:grade,p:np,n:ORDER.length});save()}
$("q").innerHTML='<div class="goal"><div class="big">'+(fails.length?'📋':'🏆')+'</div><h3>Test complete</h3><div class="grade" style="color:'+gcol(grade)+'">'+grade+'<span> / 100</span></div><p style="font-size:1.1rem;font-weight:700;color:#14233c">'+np+'/'+ORDER.length+' passed</p></div>'+
(fails.length?'<div class="cond">Failed / skipped:</div>'+fails.map(c=>'<div class="it"><b>'+esc(c.q.replace(/\n/g," — "))+'</b><span class="dl"></span><span class="ac bad">'+(tst.run[c.id]=="F"?"✗ Fail":"– skipped")+'</span></div>').join(""):'')+
recentGrades()+(fails.length?'<button class="rbtn" id="revBtn2" style="background:#d98a1c">Review · '+fails.length+'</button>':'')+'<button class="rbtn" id="restart">Restart test</button>';if($("revBtn2"))$("revBtn2").onclick=e=>{e.stopPropagation();startReview()};updRev();
$("restart").onclick=e=>{e.stopPropagation();tst={pos:0,run:{}};tsave();show()}}
function modeRows(){$("rate").classList.toggle("hide",testMode);$("ratelbl").classList.toggle("hide",testMode);$("pf").classList.toggle("hide",!testMode);$("pf").classList.add("off")}
function failedIds(){return data.lastFailed||[]}
function updRev(){const n=failedIds().length;["homeRev","revMi"].forEach(id=>{$(id).classList.toggle("hide",!n);$(id).textContent=(id=="revMi"?"🔁  ":"")+"Review · "+n})}
function revDone(){cur=null;flipped=false;modeRows();$("card").classList.remove("flip");$("srcBtn").style.display="none";$("insight").textContent="";$("tagF").textContent="";$("q").classList.remove("txt");$("q").classList.add("list");
$("q").innerHTML='<div class="goal"><div class="big">✔</div><h3>All failed items reviewed</h3><p>Each one rated 4 or 5.</p><button class="rbtn" id="revHome">⌂ Home</button></div>';$("revHome").onclick=e=>{e.stopPropagation();reviewMode=false;view("homeView")}}
function startReview(){revSet=failedIds().slice();reviewMode=true;last=null;testMode=false;$("testBadge").classList.add("hide");closeMenu();view("deckView");show()}
function show(){modeRows();if(reviewMode&&!revSet.length)return revDone();if(testMode&&tst.pos>=ORDER.length)return testDone();if(!testMode&&!reviewMode&&data.keep!=today()&&C.every(c=>todayRating(c.id)==5))return goalScreen();cur=testMode?ORDER[tst.pos]:pick();insight();(data.seen=data.seen||{})[cur.id]=Date.now();flipped=false;$("card").classList.remove("flip");$("rate").classList.add("off");$("ratelbl").style.visibility="hidden";
const p=pool(),done=p.filter(c=>todayRating(c.id)!=null).length;$("pos").textContent="Rated today: "+done+"/"+p.length;
const ta=p.map(c=>todayRating(c.id)).filter(x=>x!=null);$("prog").textContent=ta.length?"Today avg "+(ta.reduce((a,b)=>a+b,0)/ta.length).toFixed(1):"";
$("barfill").style.width=(p.length?done/p.length*100:0)+"%";
$("tagF").textContent=$("tagB").textContent="Slide "+cur.s+" · "+T[cur.s];$("q").textContent=cur.q;$("a").innerHTML=backHTML(cur);$("a").scrollTop=0;
if(testMode){steps=mkSteps(cur);tIdx=-1;tRev=false;$("q").id="q";$("q").classList.remove("txt");$("q").classList.add("list");renderTest()}else{$("q").classList.add("txt");$("q").classList.remove("list")}
const av=avg(cur.id);$("lvl").textContent=av!=null?"avg "+av.toFixed(1):"New card";
$("srcBtn").style.display=cur.s==6?"none":""}
function flip(){flipped=!flipped;$("card").classList.toggle("flip",flipped);$("rate").classList.toggle("off",!flipped);$("ratelbl").style.visibility=flipped?"":"hidden"}
function testResult(pass){if(!testMode||!flipped||!cur)return;const v=pass?"P":"F";tst.run[cur.id]=v;tst.pos++;tsave();(data.tests=data.tests||{});(data.tests[cur.id]=data.tests[cur.id]||[]).push({d:today(),p:pass});(data.hist[cur.id]=data.hist[cur.id]||[]).push({d:today(),r:pass?5:1,src:"test"});save();last=cur;show()}
function rate(r){if(!flipped||!cur||testMode)return;(data.hist[cur.id]=data.hist[cur.id]||[]).push({d:today(),r});if(reviewMode&&r>=4)revSet=revSet.filter(x=>x!=cur.id);save();last=cur;show()}
function stats(){const pill=v=>v==null?"–":'<span class="pill" style="background:'+COL[Math.round(v)]+'">'+(Number.isInteger(v)?v:v.toFixed(1))+"</span>";
$("statsBody").innerHTML=(recentGrades()?'<div class="face" style="position:static;margin-bottom:14px;padding:16px 18px">'+recentGrades()+"</div>":"")+"<table><tr><th></th><th>Card</th><th>Today</th><th>All-time avg</th><th>#</th></tr>"+C.map(c=>{const tt=(data.tests||{})[c.id]||[],np=tt.filter(t=>t.p).length,nf=tt.length-np;return "<tr><td>S"+c.s+"</td><td>"+esc(c.q.replace(/\n/g," — "))+(tt.length?'<div style="font-size:.72rem;opacity:.7;margin-top:2px">Test: <span class="ok">'+np+'✓</span> <span class="bad">'+nf+'✗</span></div>':"")+"</td><td>"+pill(todayRating(c.id))+"</td><td>"+pill(avg(c.id))+"</td><td>"+(data.hist[c.id]||[]).length+"</td></tr>"}).join("")+"</table>"}
function view(v){if(v=="homeView")reviewMode=false;updRev();$("menu").classList.add("hide");$("homeBtn").classList.toggle("hide",v=="homeView");$("menuBtn").classList.toggle("hide",v=="homeView");if(v=="homeView"){$("testBadge").classList.add("hide");$("homeResume").textContent=tst.pos>0&&tst.pos<ORDER.length?"Test in progress · card "+(tst.pos+1)+"/"+ORDER.length:""}else $("testBadge").classList.toggle("hide",!testMode);["homeView","deckView","statsView"].forEach(x=>$(x).classList.toggle("hide",x!=v))}
const closeMenu=()=>$("menu").classList.add("hide");
$("menuBtn").onclick=()=>$("menu").classList.remove("hide");$("menu").onclick=e=>{if(e.target.id=="menu")closeMenu()};
$("srcBtn").onclick=e=>{e.stopPropagation();$("srcimg").src="img/slide"+cur.s+".png?v=3";$("srcModal").classList.remove("hide")};$("srcModal").onclick=()=>$("srcModal").classList.add("hide");
$("scene").onclick=()=>{if(!cur)return;testMode?testTap():flip()};$("flipBtn").onclick=()=>{closeMenu();flip()};$("skip").onclick=()=>{closeMenu();if(testMode&&cur){tst.pos++;tsave()}last=cur;show()};
$("passBtn").onclick=()=>testResult(true);$("failBtn").onclick=()=>testResult(false);
document.querySelectorAll("#rate button").forEach(b=>b.onclick=()=>rate(+b.dataset.r));
function setTest(on){testMode=on;reviewMode=false;try{localStorage.setItem("recurrentFC_mode",on?"test":"normal")}catch(e){}$("testBtn").textContent="🧪  Test mode: "+(on?"ON":"OFF");$("testBadge").classList.toggle("hide",!on);closeMenu();view("deckView");show()}
$("restartMi").onclick=()=>{tst={pos:0,run:{}};tsave();if(!testMode)setTest(true);else{closeMenu();view("deckView");show()}};
$("homeRev").onclick=startReview;$("revMi").onclick=startReview;
const goHome=()=>view("homeView");$("homeBtn").onclick=goHome;$("homeMi").onclick=goHome;
$("homeFlash").onclick=()=>setTest(false);$("homeTest").onclick=()=>{if(tst.pos>=ORDER.length){tst={pos:0,run:{}};tsave()}setTest(true)};
$("testBtn").onclick=()=>setTest(!testMode);$("testBadge").onclick=()=>$("menu").classList.remove("hide");
$("statsBtn").onclick=()=>{stats();view("statsView")};$("back").onclick=()=>{view("deckView");show()};
$("reset").onclick=()=>{if(confirm("Reset all ratings and history on this device?")){data={hist:{}};save();closeMenu();show()}};
document.addEventListener("keydown",e=>{if($("deckView").classList.contains("hide"))return;if(e.key==" "){e.preventDefault();testMode?testTap():flip()}else if(testMode&&/^[pP1]$/.test(e.key))testResult(true);else if(testMode&&/^[fF2]$/.test(e.key))testResult(false);else if(/^[1-5]$/.test(e.key))rate(+e.key);else if(e.key=="ArrowRight"){last=cur;show()}});
data=load();if(data.tests&&!data.testsMigrated){for(const id in data.tests){const h=(data.hist[id]=data.hist[id]||[]);data.tests[id].forEach(t=>h.push({d:t.d,r:t.p?5:1,src:"test"}));h.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0)}}data.testsMigrated=true;save();view("homeView");
</script></body></html>
